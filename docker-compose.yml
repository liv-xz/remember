services:
  mysql:
    image: mysql:8.0
    container_name: rememberme-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: RememberMe
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rememberme-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rememberme-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: prod
      DB_HOST: mysql
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WX_APP_ID: ${WX_APP_ID}
      WX_APP_SECRET: ${WX_APP_SECRET}
    volumes:
      - uploads-data:/app/uploads

  web:
    build:
      context: ./rememberme-web
      dockerfile: Dockerfile
    container_name: rememberme-web
    restart: unless-stopped
    depends_on:
      - server

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: rememberme-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
      - web

volumes:
  mysql-data:
  redis-data:
  uploads-data:
