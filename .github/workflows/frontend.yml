name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'rememberme-web/**'
  pull_request:
    branches: [main]
    paths:
      - 'rememberme-web/**'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rememberme-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rememberme-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
